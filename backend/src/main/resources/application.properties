spring.application.name=ClearScan
server.port=8081

# Threat Intelligence (Google Safe Browsing)
# Set GOOGLE_SAFE_BROWSING_API_KEY environment variable to enable live threat intelligence
clearscan.threat-intel.api-key=${GOOGLE_SAFE_BROWSING_API_KEY:}
clearscan.threat-intel.enabled=${CLEARSCAN_THREAT_INTEL_ENABLED:false}
clearscan.threat-intel.timeout-ms=5000

# Request limits
spring.servlet.multipart.max-request-size=1MB
server.tomcat.max-http-form-post-size=1048576
